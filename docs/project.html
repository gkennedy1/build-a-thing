<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7f3">
  <meta name="description" content="Read the pitch and see screenshots from projects on Build a Thing.">
  <title>Project — Build a Thing</title>
  <link rel="icon" type="image/svg+xml" href="./project-roll.svg">
  <link rel="stylesheet" href="./styles.css?v=9">
  <link rel="stylesheet" href="./project-likes.css">
  <script src="./projects.js?v=5" defer></script>
  <script src="./project-likes.js" defer></script>
  <script src="./site.js?v=6" defer></script>
  <script src="./roll-scenes.js" defer></script>
</head>
<body>
  <header class="site-header wrap">
    <a class="wordmark" href="./index.html"><img src="./project-roll.svg" width="22" height="22" alt="">Build a Thing</a>
    <nav aria-label="Main navigation">
      <a href="./index.html#projects">Projects</a>
      <a href="./index.html#updates">Updates</a>
      <a href="https://github.com/gkennedy1" class="github-link">GitHub</a>
    </nav>
  </header>

  <main class="project-detail wrap">
    <p id="detail-message" role="status">Loading project…</p>
    <noscript>Enable JavaScript to view project details.</noscript>
    <article id="project-detail" aria-labelledby="project-title" hidden>
      <div class="roll-scene roll-scene--end" data-roll-scene="workbench" aria-hidden="true"></div>
      <header class="detail-header">
        <div class="detail-title">
          <h1 id="project-title"></h1>
          <span id="project-status"></span>
        </div>
        <p id="project-description"></p>
        <div id="detail-links" class="project-links" hidden></div>
      </header>

      <section id="pitch" class="detail-section" aria-labelledby="pitch-title" hidden>
        <h2 id="pitch-title" class="section-title">Pitch</h2>
        <div id="pitch-copy" class="pitch-copy"></div>
      </section>

      <section id="feedback" class="detail-section" aria-labelledby="feedback-title">
        <h2 id="feedback-title" class="section-title">Feedback</h2>
        <div>
          <p class="pitch-copy">Leave a like to show your support, or send me a message to share an idea.</p>
          <div class="project-links">
            <div class="project-reaction">
              <button type="button" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M12 20.5 4.8 13.6c-4.4-4.2 1.7-10.6 6.1-6.3l1.1 1.1 1.1-1.1c4.4-4.3 10.5 2.1 6.1 6.3Z" />
                </svg>
                <span>Leave a like</span>
              </button>
              <span class="like-count" role="status"></span>
            </div>
            <a href="https://www.linkedin.com/in/greg-kennedy-54481316/">Message me on LinkedIn</a>
          </div>
          <p class="like-message muted" role="status"></p>
        </div>
      </section>

      <section id="screenshots" class="detail-section" aria-labelledby="screenshots-title" hidden>
        <h2 id="screenshots-title" class="section-title">Screenshots</h2>
        <div id="screenshot-grid" class="screenshot-grid"></div>
      </section>
      <div class="roll-scene roll-scene--bottom" data-roll-scene="arcade" aria-hidden="true"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="footer-layout wrap">
      <span>Build a Thing · Greg Kennedy</span>
      <a href="https://github.com/gkennedy1/build-a-thing">View source on GitHub</a>
    </div>
  </footer>
</body>
</html>
