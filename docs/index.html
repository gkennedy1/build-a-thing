<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Follow Greg Kennedy’s side projects, their current status and what’s next.">
  <meta name="theme-color" content="#f9f7f3">
  <title>Build a Thing — Greg Kennedy</title>
  <link rel="icon" type="image/svg+xml" href="./project-roll.svg">
  <link rel="stylesheet" href="./styles.css?v=13">
  <script src="./projects.js?v=6" defer></script>
  <script src="./site.js?v=7" defer></script>
  <script src="./hero-halo.js" defer></script>
  <script src="./hero-wave.js" defer></script>
  <script src="./roll-scenes.js?v=6" defer></script>
</head>
<body>
  <header class="site-header wrap">
    <a class="wordmark" href="./index.html"><img src="./project-roll.svg" width="22" height="22" alt="">Build a Thing</a>
    <nav aria-label="Main navigation">
      <a href="#projects">Projects</a>
      <a href="#updates">Updates</a>
      <a href="https://github.com/gkennedy1" class="github-link">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="site-title">
      <div class="hero-halo" aria-hidden="true"><canvas></canvas></div>
      <div class="intro-layout wrap">
        <div class="intro-copy">
          <h1 id="site-title">What I’m<br>building<span>.</span></h1>
          <p>Side projects by Greg Kennedy. See what’s underway, what’s shipped, and what’s coming next.</p>
          <a class="intro-link" href="#projects">Explore projects</a>
        </div>
        <aside class="featured-project" aria-labelledby="featured-title" hidden></aside>
      </div>
      <svg class="hero-wave" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 100H1000V101H0Z"/>
      </svg>
    </section>

    <section class="projects wrap" aria-labelledby="projects">
      <div class="roll-scene roll-scene--end" data-roll-scene="desk" aria-hidden="true"></div>
      <h2 id="projects" class="section-title" tabindex="-1">Projects</h2>
      <div class="filters" role="group" aria-label="Filter projects by status" hidden></div>
      <p class="visually-hidden" id="results" role="status"></p>
      <div id="project-list"><p class="muted">Loading projects…</p></div>
      <noscript>Enable JavaScript to view the project list.</noscript>
      <div class="roll-scene roll-scene--bottom" data-roll-scene="workbench" aria-hidden="true"></div>
    </section>

    <section class="updates" aria-labelledby="updates">
      <div class="updates-roll" aria-hidden="true">
        <div class="roll-scene roll-scene--end" data-roll-scene="arcade"></div>
      </div>
      <div class="updates-layout wrap">
        <h2 id="updates" class="section-title" tabindex="-1">Recent updates</h2>
        <ol id="update-list"></ol>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-layout wrap">
      <span>Build a Thing · Greg Kennedy</span>
    </div>
  </footer>
</body>
</html>
